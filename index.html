body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--veil)}
.frame{max-width:480px;margin:0 auto;padding:14px 14px 100px}
section{background:var(--card);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-9px;border-radius:130px 130px 22px 22px;padding:76px 30px 50px;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 30px rgba(120,70,80,.12)}
section.hero{aspect-ratio:5/7;background:var(--art) center/cover;border:0;outline:0;border-radius:22px;padding:19% 21% 14%;justify-content:center;color:#7a4150;--gold:#c79a84;--muted:#9a7580;--line:#e8c4c8;--accent:#d4788b}
h1,h2,h3,.cap{font-family:Cinzel,Georgia,serif;margin:0}
h1{font-size:17px;letter-spacing:.08em}
h2{font-size:22px;letter-spacing:.08em;margin:6px 0 16px}
h3{font-size:15px;letter-spacing:.1em;margin:0 0 4px}
.cap{font-size:10px;font-weight:500;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;margin:12px 0}
.names{font-family:"Great Vibes","Snell Roundhand",cursive;font-size:56px;line-height:1.05;margin:10px 0}
.names i{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:var(--accent);font-size:26px;display:block;margin:2px 0}
.orn{color:var(--gold);letter-spacing:.5em}
.parents{display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--muted);margin:8px 0 16px}
.parents b{display:block;color:var(--ink);font-family:Cinzel,Georgia,serif;font-size:10px;letter-spacing:.18em;margin-bottom:1px}
.bigdate{font-family:Cinzel,Georgia,serif;font-size:15px;letter-spacing:.14em;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 14px}
p{margin:6px 0;line-height:1.5}
.muted{color:var(--muted)}
.tl{width:100%;text-align:left;border-left:1px solid var(--line);margin:10px 0 0 10px;padding-left:22px}
.tl div{margin-bottom:22px;position:relative}
.tl div::before{content:"◆";position:absolute;left:-29px;top:0;color:var(--gold);font-size:11px;background:var(--solid)}
.tl small{font-family:Cinzel,Georgia,serif;font-size:10px;letter-spacing:.2em;color:var(--gold)}
.count{display:flex;gap:10px;margin:14px 0}
.count div{border:1px solid var(--line);border-radius:40px 40px 12px 12px;padding:14px 8px 10px;min-width:62px;background:var(--solid)}
.count b{display:block;font-family:Cinzel,Georgia,serif;font-size:24px}
.count small{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ev{width:100%;border:1px solid var(--line);border-radius:60px 60px 14px 14px;padding:22px 18px 16px;margin-bottom:12px;background:var(--solid)}
.btn{display:inline-block;margin-top:16px;padding:13px 28px;border-radius:999px;border:0;background:linear-gradient(135deg,#eeb0bc,#cc7a8e);color:#fff;text-decoration:none;font-family:Cinzel,Georgia,serif;font-size:11px;letter-spacing:.16em;cursor:pointer;box-shadow:0 6px 16px rgba(204,122,142,.38)}
form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:10px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit}
label{text-align:left;font-family:Cinzel,Georgia,serif;font-size:10px;letter-spacing:.16em;color:var(--gold)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 28px));display:flex;justify-content:space-around;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 6px;box-shadow:0 8px 28px rgba(120,70,80,.25);backdrop-filter:blur(8px)}
nav a{color:var(--ink);text-decoration:none;font-family:Cinzel,Georgia,serif;font-size:10px;letter-spacing:.1em;padding:4px 6px;text-transform:uppercase}

.hero>*{opacity:0}
body.go .hero>*{animation:up 1.2s cubic-bezier(.2,.7,.2,1) both}
body.go .hero>*:nth-child(1){animation-delay:.1s}body.go .hero>*:nth-child(2){animation-delay:.35s}body.go .hero>*:nth-child(3){animation-delay:.55s}body.go .hero>*:nth-child(4){animation-delay:.8s}body.go .hero>*:nth-child(5){animation-delay:1.1s}body.go .hero>*:nth-child(6){animation-delay:1.35s}
@keyframes up{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
section:not(.hero){position:relative;overflow:hidden}
section:not(.hero)::before,section:not(.hero)::after{content:"";position:absolute;pointer-events:none;background-size:cover;z-index:0;-webkit-mask-image:radial-gradient(closest-side,#000 40%,transparent 100%);mask-image:radial-gradient(closest-side,#000 40%,transparent 100%)}
section:not(.hero)::before{left:-34px;bottom:-30px;width:170px;height:200px;background-image:var(--flower);opacity:.85;animation:bob 7s ease-in-out infinite alternate}
section:not(.hero)::after{right:-30px;top:34px;width:140px;height:170px;background-image:var(--sprig);opacity:.7;animation:bob 9s ease-in-out -3s infinite alternate}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) section:not(.hero)::before,:root:not([data-theme="light"]) section:not(.hero)::after{opacity:.4}}
@keyframes bob{from{transform:translateY(-6px) rotate(-2deg)}to{transform:translateY(8px) rotate(2deg)}}
.rv>*{position:relative;z-index:1;opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}

})();
